openapi: 3.0.3
info:
  title: CAB System API - 09-payment-rating
  description: Part of the CAB System API, split from the original OpenAPI YAML.
  version: 1.0.0
servers:
- url: http://localhost:8080/api
  description: Local development server
paths:
  /payments:
    post:
      tags:
      - Payments
      summary: Thanh toán chuyến đi
      operationId: createPayment
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '201':
          description: Thanh toán được xử lý
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          description: Thanh toán thất bại
  /trips/{tripId}/ratings:
    post:
      tags:
      - Ratings
      summary: Đánh giá chuyến đi
      operationId: createRating
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatingRequest'
      responses:
        '201':
          description: Đánh giá thành công
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TripId:
      name: tripId
      in: path
      required: true
      schema:
        type: integer
  schemas:
    RatingRequest:
      type: object
      required:
      - score
      properties:
        score:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
    Payment:
      type: object
      properties:
        paymentId:
          type: integer
        tripId:
          type: integer
        amount:
          type: number
          format: double
        method:
          type: string
        status:
          type: string
          enum:
          - PENDING
          - SUCCESS
          - FAILED
    PaymentRequest:
      type: object
      required:
      - tripId
      - amount
      - method
      properties:
        tripId:
          type: integer
        amount:
          type: number
          format: double
        method:
          type: string
          enum:
          - CASH
          - ELECTRONIC
