openapi: 3.0.3
info:
  title: CAB System API - 01-authentication
  description: Part of the CAB System API, split from the original OpenAPI YAML.
  version: 1.0.0
servers:
- url: http://localhost:8080/api
  description: Local development server
paths:
  /auth/register:
    post:
      tags:
      - Authentication
      summary: Đăng ký tài khoản
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Đăng ký thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Dữ liệu không hợp lệ
  /auth/login:
    post:
      tags:
      - Authentication
      summary: Đăng nhập
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Sai thông tin đăng nhập
components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        role:
          type: string
          enum:
          - CUSTOMER
          - DRIVER
          - OPERATION
          - ADMIN
    RegisterRequest:
      type: object
      required:
      - name
      - email
      - phone
      - password
      properties:
        name:
          type: string
          example: Nguyen Van A
        email:
          type: string
          format: email
          example: user@example.com
        phone:
          type: string
          example: 0901234567
        password:
          type: string
          format: password
          example: '123456'
    LoginResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
